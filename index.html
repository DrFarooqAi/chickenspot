<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>بروست د. فاروق الحار | Dr Farooq Spicy Broast</title>
<meta name="description" content="بروست حار طازج — اطلب عبر واتساب واستلم خلال دقائق">
<meta name="theme-color" content="#2B1208">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بروست د. فاروق">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="بروست د. فاروق الحار | Dr Farooq Spicy Broast">
<meta property="og:description" content="بروست حار ومقرمش — عروض يومية، اطلب عبر واتساب">
<meta property="og:image" content="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#E04E14;--brand-2:#C2410C;--deep:#2B1208;--deep-2:#4A1C0B;--gold:#FBBF24;--chili:#DC2626;--cream:#FFF7ED;--ink:#1F130C;--soft:#8A6A55;--line:#F1E2D0;--tint:#FFF1E0;--green:#16A34A}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.hide{display:none!important}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;padding-top:env(safe-area-inset-top)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;min-width:0}
.brand img{width:38px;height:38px;border-radius:11px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;border:1.5px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px;cursor:pointer}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(110% 120% at 85% 10%,#F97316 0%,#C2410C 28%,#7C2D12 58%,var(--deep) 100%);border-radius:0 0 34px 34px;padding:26px 0 34px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 110%,rgba(251,191,36,.25),transparent 40%);pointer-events:none}
.hero .wrap{position:relative;display:flex;align-items:center;gap:18px}
.hero .txt{flex:1;min-width:0}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);padding:4px 12px;border-radius:20px;margin-bottom:10px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.dot.closed{background:#F87171;box-shadow:0 0 0 3px rgba(248,113,113,.25)}
.hero h1{font-size:32px;font-weight:900;line-height:1.2;letter-spacing:-.3px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:15px;color:#FFE4CC;margin-top:8px;line-height:1.6}
.ctas{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}
.btn.gold{background:var(--gold);color:var(--deep);box-shadow:0 8px 20px -6px rgba(251,191,36,.6)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:700;background:rgba(0,0,0,.22);padding:5px 11px;border-radius:20px;color:#FFEBD6}
.art{flex:none;width:140px;height:140px;position:relative}
.art::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.55),rgba(251,191,36,0) 70%);filter:blur(4px)}
.art svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.35))}
/* sticky category tabs */
.tabs{position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:15;background:rgba(255,247,237,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:11px;padding-bottom:11px}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:#fff;font-size:14.5px;font-weight:800;padding:8px 18px;border-radius:22px;cursor:pointer;box-shadow:0 1px 2px rgba(31,19,12,.06),inset 0 0 0 1.5px var(--line);color:#5B3A26}
.tab.on{background:var(--deep);color:#fff;box-shadow:0 6px 14px -6px rgba(43,18,8,.6)}
/* reorder */
.reorder{margin-top:18px;width:100%;display:flex;align-items:center;gap:12px;text-align:start;background:linear-gradient(135deg,#ECFDF3,#fff);border:1.5px solid #BBF7D0;border-radius:20px;padding:12px 14px;cursor:pointer}
.reorder .ic{width:44px;height:44px;border-radius:14px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.reorder b{display:block;font-size:15px;color:#14532D}
.reorder span{font-size:13px;color:var(--soft)}
.reorder .go{margin-inline-start:auto;background:var(--green);color:#fff;font-weight:800;font-size:13px;padding:7px 14px;border-radius:12px;flex:none}
/* menu */
.cat{padding-top:24px;scroll-margin-top:calc(124px + env(safe-area-inset-top))}
.cat-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.cat-h h2{font-size:23px;font-weight:900;position:relative}
.cat-h h2::after{content:"";position:absolute;inset-inline-start:0;bottom:-2px;width:34px;height:4px;border-radius:4px;background:var(--brand)}
.cat-h span{font-size:13px;color:var(--soft);font-weight:600}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:#fff;border-radius:22px;padding:12px;display:flex;align-items:stretch;gap:14px;position:relative;cursor:pointer;text-align:start;border:1px solid #F3E4D2;box-shadow:0 1px 2px rgba(31,19,12,.05),0 10px 24px -16px rgba(124,45,18,.35);transition:transform .15s,box-shadow .15s}
.card:active{transform:scale(.985)}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,19,12,.06),0 18px 30px -16px rgba(124,45,18,.45)}}
.card.deal{border:2px solid var(--gold);background:linear-gradient(180deg,#FFFBEB,#fff 55%)}
.ribbon{position:absolute;top:-10px;inset-inline-end:14px;background:var(--chili);color:#fff;font-size:12px;font-weight:800;padding:2px 11px;border-radius:20px;box-shadow:0 4px 10px -4px rgba(220,38,38,.6);z-index:1}
.ribbon.hot{background:var(--deep)}
.pic{width:104px;height:104px;flex:none;border-radius:18px;background:radial-gradient(circle at 50% 38%,#FFF6E8 0%,#FFE2BC 60%,#FFD39C 100%);display:flex;align-items:center;justify-content:center;position:relative;overflow:visible}
.pic svg{width:86%;height:86%;filter:drop-shadow(0 6px 6px rgba(124,45,18,.22))}
.incart{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--green);color:#fff;font-size:12px;font-weight:800;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 7px;box-shadow:0 0 0 2px #fff}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.info h3{font-size:17px;font-weight:800;line-height:1.35}
.info .sub{font-size:13px;color:var(--soft);line-height:1.55;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:800;color:var(--chili);background:#FEF2F2;padding:1px 8px;border-radius:10px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;gap:8px}
.price{font-size:18px;font-weight:900;color:var(--ink)}
.price small{font-size:12px;font-weight:700;color:var(--soft)}
.price s{color:#B39A88;font-size:13px;font-weight:600;margin-inline-start:6px}
.add{flex:none;height:38px;min-width:38px;padding:0 14px;border-radius:19px;background:var(--brand);color:#fff;border:0;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:4px;box-shadow:0 6px 14px -6px rgba(224,78,20,.7)}
.add b{font-size:20px;line-height:1;font-weight:700}
/* visit + install */
.sec{font-size:23px;font-weight:900;margin:30px 0 14px}
.infogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:18px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px;cursor:pointer;border:1px solid #F3E4D2}
.tile .ic{width:38px;height:38px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:6px}
.tile b{font-size:14.5px;font-weight:800}
.tile span{font-size:13px;color:var(--soft)}
.social{display:flex;gap:10px;margin-top:12px}
.social a{flex:1;background:#fff;border-radius:14px;padding:10px;text-align:center;text-decoration:none;color:var(--ink);font-size:13px;font-weight:700;border:1px solid #F3E4D2}
.install{margin-top:22px;background:linear-gradient(135deg,var(--deep),var(--deep-2));color:#fff;border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px}
.install img{width:56px;height:56px;border-radius:15px;flex:none}
.install b{font-size:16px;display:block}
.install span{font-size:13px;color:#FFD7B5}
.install button{margin-inline-start:auto;flex:none;background:var(--gold);color:var(--deep);border:0;font-weight:800;font-size:14px;padding:10px 16px;border-radius:12px;cursor:pointer}
.ios{font-size:13px;color:var(--deep-2);background:var(--tint);border-radius:12px;padding:10px;margin-top:10px;line-height:1.7}
footer{text-align:center;font-size:12px;color:#B39A88;padding:24px 0 10px}
/* bottom bar */
.bar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,247,237,0),var(--cream) 40%)}
.bar .in{max-width:560px;margin:0 auto}
.big{width:100%;border:0;border-radius:18px;background:var(--deep);color:#fff;font-size:17px;font-weight:800;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;box-shadow:0 12px 26px -10px rgba(43,18,8,.65)}
.big.wa{background:var(--green);box-shadow:0 12px 26px -10px rgba(22,163,74,.6)}
.big.or{background:var(--brand);box-shadow:0 12px 26px -10px rgba(224,78,20,.6)}
.big .r{background:rgba(255,255,255,.18);padding:2px 12px;border-radius:10px;white-space:nowrap}
.big .l{display:flex;align-items:center;gap:10px}
.count{background:var(--gold);color:var(--deep);border-radius:10px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;padding:0 6px}
/* sheets */
.shade{position:fixed;inset:0;z-index:50;background:rgba(31,19,12,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:560px;margin:0 auto;background:var(--cream);border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:#E3CDB5;margin:8px auto 0;flex:none}
.sh-head{display:flex;align-items:center;gap:12px;padding:10px 16px}
.sh-head h3{font-size:20px;font-weight:900;flex:1}
.x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:#fff;font-size:18px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.sh-hero{margin:0 16px 12px;border-radius:20px;height:150px;background:radial-gradient(circle at 50% 40%,#FFF6E8 0%,#FFE2BC 60%,#FFD39C 100%);display:flex;align-items:center;justify-content:center}
.sh-hero svg{height:88%;filter:drop-shadow(0 10px 10px rgba(124,45,18,.25))}
.sh-body{overflow-y:auto;padding:0 16px 12px;flex:1}
.sh-foot{padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.grp{background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:12px;border:1px solid #F3E4D2}
.grp h4{font-size:14.5px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.grp h4 small{font-weight:700;color:var(--soft);font-size:11.5px;background:var(--tint);padding:1px 8px;border-radius:8px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:start}
.grp h4+.opt{border-top:0}
.opt .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #D6BFA6;display:flex;align-items:center;justify-content:center}
.opt.chk .mk{border-radius:7px}
.opt.on .mk{border-color:var(--brand);background:var(--brand)}
.opt.on .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.chk.on .mk::after{width:10px;height:6px;border-radius:0;background:none;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:15px;font-weight:700}
.opt .t span{font-size:12px;color:var(--soft)}
.opt .p{font-size:14px;font-weight:800;color:var(--brand-2);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.segb{border:2px solid var(--line);background:#fff;border-radius:14px;padding:11px 8px;font-size:15px;font-weight:800;cursor:pointer}
.segb.on{border-color:var(--brand);background:#FFF1E6;color:var(--brand-2)}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:34px;height:34px;border-radius:50%;border:0;font-size:20px;font-weight:700;cursor:pointer;line-height:1;background:var(--tint);color:var(--deep-2)}
.step button.pl{background:var(--brand);color:#fff}
.step span{min-width:22px;text-align:center;font-weight:800;font-size:16px}
.qrow{display:flex;align-items:center;justify-content:space-between}
/* cart */
.line{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .mini{width:52px;height:52px;flex:none;border-radius:14px;background:radial-gradient(circle at 50% 38%,#FFF6E8,#FFD9A8);display:flex;align-items:center;justify-content:center}
.line .mini svg{width:84%;height:84%}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:15px}
.line .t span{display:block;font-size:12px;color:var(--soft)}
.line .t i{font-style:normal;font-weight:800;color:var(--brand-2);font-size:14px}
.more{display:block;width:100%;background:none;border:2px dashed #E3C9AC;border-radius:14px;padding:10px;font-weight:800;color:var(--brand-2);cursor:pointer;margin-top:4px}
textarea,input{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--brand)}
input{margin-top:10px}
.loc{width:100%;margin-top:10px;font-size:14px;font-weight:800;padding:11px;border-radius:12px;border:2px dashed var(--brand);background:#fff;color:var(--brand-2);cursor:pointer}
.loc.ok{border-style:solid;background:#ECFDF3;border-color:var(--green);color:#166534}
.branches{display:grid;gap:8px}
.notice{background:#FEF2F2;color:#991B1B;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;font-size:18px;font-weight:900}
.pay{font-size:13px;color:var(--soft);text-align:center;margin:4px 0 8px}
.err{color:#B91C1C;font-size:13px;font-weight:800;text-align:center;margin-bottom:6px}
.err:empty{display:none}
.empty{text-align:center;padding:24px 0;color:var(--soft)}
.empty svg{width:120px;height:120px;opacity:.9}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--deep);color:#fff;font-size:14px;font-weight:700;padding:9px 18px;border-radius:22px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* larger screens */
@media(min-width:720px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero{padding:40px 0 48px}
  .hero h1{font-size:44px}
  .hero p{font-size:17px;max-width:520px}
  .art{width:240px;height:240px}
  .infogrid{grid-template-columns:repeat(4,1fr)}
  .install{max-width:640px}
}
@media(min-width:1060px){.grid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:52px}.art{width:290px;height:290px}}
@media(max-width:719px){
  .hero{padding:20px 0 26px}
  .art{position:absolute;top:-6px;inset-inline-end:8px;width:128px;height:128px}
  .status,.hero h1{margin-inline-end:124px}
  .hero h1{font-size:30px}
  .hero p{font-size:14.5px}
  .ctas .btn{flex:1;justify-content:center}
}
@media(max-width:380px){.art{width:108px;height:108px}.status,.hero h1{margin-inline-end:100px}.hero h1{font-size:26px}.pic{width:88px;height:88px}}
</style>
</head>
<body>

<div class="topbar"><div class="wrap">
  <div class="brand"><img src="icon-192.png" alt=""><span id="shopName"></span></div>
  <button class="pill" id="langBtn" onclick="toggleLang()">EN</button>
</div></div>

<header class="hero"><div class="wrap">
  <div class="txt">
    <span class="status"><span class="dot" id="dot"></span><span id="openTxt"></span></span>
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
    <div class="ctas">
      <button class="btn gold" onclick="goCat(firstCat())" data-t="orderNow"></button>
      <a class="btn ghost" id="heroCall" data-t="call"></a>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="art" id="heroArt"></div>
</div></header>

<nav class="tabs"><div class="wrap" id="tabs"></div></nav>

<main class="wrap">
  <button class="reorder hide" id="reorder" onclick="reorder()"></button>
  <div id="menu"></div>

  <h2 class="sec" data-t="visit"></h2>
  <div class="infogrid">
    <a class="tile" id="mapLink" target="_blank" rel="noopener"><span class="ic">📍</span><b data-t="map"></b><span id="areaTxt"></span></a>
    <a class="tile" id="callLink"><span class="ic">📞</span><b data-t="callT"></b><span id="phoneTxt" dir="ltr"></span></a>
    <div class="tile"><span class="ic">🕛</span><b data-t="hoursT"></b><span id="hoursTxt"></span></div>
    <a class="tile" onclick="share()"><span class="ic">🔗</span><b data-t="share"></b><span data-t="shareSub"></span></a>
  </div>
  <div class="social" id="social"></div>

  <div id="installSec">
    <div class="install">
      <img src="icon-192.png" alt="">
      <div><b data-t="instT"></b><span data-t="instS"></span></div>
      <button onclick="installApp()" data-t="instB"></button>
    </div>
    <div class="ios hide" id="iosHelp" data-t="ios"></div>
  </div>
  <footer id="foot"></footer>
</main>

<div class="bar"><div class="in">
  <button class="big" id="cartBtn" onclick="openCart()">
    <span class="l"><span class="count" id="cartCount">0</span><span data-t="viewCart"></span></span>
    <span class="r" id="cartTotal">0</span>
  </button>
</div></div>

<div class="shade" id="shade" onclick="closeSheets()"></div>

<!-- item options sheet -->
<div class="sheet" id="itemSheet" role="dialog" aria-modal="true">
  <div class="sh-head"><h3 id="isName"></h3><button class="x" onclick="closeSheets()" aria-label="close">✕</button></div>
  <div class="sh-body"><div class="sh-hero" id="isPic" style="margin:0 0 12px"></div><div id="isBody"></div></div>
  <div class="sh-foot">
    <div class="qrow" style="gap:12px">

};
const artOf=i=>ART[i.art]||ART.broast;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const L=(o,k)=>o[k+'_'+lang]!==undefined?o[k+'_'+lang]:o[lang];
const NAME=o=>o[lang];
const byId={};SHOP.items.forEach(i=>byId[i.id]=i);
const sauceById={};SHOP.sauces.forEach(s=>sauceById[s.id]=s);
const store={get(k,d){try{const v=localStorage.getItem('dfb_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dfb_'+k,JSON.stringify(v))}catch(e){}}};
function fmt(h,l){const ap=h<12?(l==='ar'?'ص':'am'):(l==='ar'?'م':'pm');return (h%12||12)+' '+ap}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function isOpen(){const h=new Date().getHours(),o=SHOP.open,c=SHOP.close;return o<c?(h>=o&&h<c):(h>=o||h<c)}
function priceOf(item,sizeId){if(item.sizes){const s=item.sizes.find(x=>x.id===sizeId)||item.sizes[0];return s.price}return item.price}
function fromPrice(item){return item.sizes?Math.min(...item.sizes.map(s=>s.price)):item.price}
function dealWorth(item){if(!item.includes)return 0;return item.includes.reduce((sum,str)=>{const m=str.match(/^([\w-]+)(?::([\w-]+))?(?:\*(\d+))?$/);if(!m||!byId[m[1]])return sum;return sum+priceOf(byId[m[1]],m[2])*(+m[3]||1)},0)}

/* ---------- state ---------- */
const browserAr=/^ar/i.test(navigator.language||'ar');
let lang=store.get('lang',browserAr?'ar':'en'), cart=store.get('cart',[]), mode=store.get('mode',''), branch=store.get('branch',SHOP.branches.length===1?SHOP.branches[0].id:''), loc='';
let note='', sel=null;
if(!SHOP.branches.some(b=>b.id===branch))branch=SHOP.branches.length===1?SHOP.branches[0].id:'';
cart=cleanCart(cart);
function cleanCart(c){return (c||[]).filter(l=>byId[l.id]&&(!byId[l.id].sizes||byId[l.id].sizes.some(s=>s.id===l.size))).map(l=>({...l,sauces:(l.sauces||[]).filter(s=>sauceById[s])}))}
function lineKey(l){return [l.id,l.size||'',l.spicy===null||l.spicy===undefined?'':l.spicy?'s':'r',(l.sauces||[]).slice().sort().join('+')].join('|')}
function unitPrice(l){return priceOf(byId[l.id],l.size)+(l.sauces||[]).reduce((s,id)=>s+sauceById[id].price,0)}
function cartSum(){return cart.reduce((s,l)=>s+unitPrice(l)*l.qty,0)}
function cartCount(){return cart.reduce((s,l)=>s+l.qty,0)}
function saveCart(){store.set('cart',cart)}
function curBranch(){return SHOP.branches.find(b=>b.id===branch)||SHOP.branches[0]}

/* ---------- menu ---------- */
function cardHTML(i,inPopular){
  const t=T[lang],worth=dealWorth(i),save=worth>i.price?worth-i.price:0,n=cart.filter(l=>l.id===i.id).reduce((s,l)=>s+l.qty,0);
  const ribbon=save>0?`<span class="ribbon">${t.save(save)}</span>`:(inPopular&&i.popular?`<span class="ribbon hot">${t.bestTag}</span>`:'');
  const pr=i.sizes?`<small>${t.from}</small> ${fromPrice(i)} <small>${t.sar}</small>`:`${i.price} <small>${t.sar}</small>${save>0?`<s>${worth}</s>`:''}`;
  return `<div class="card ${save>0?'deal':''}" onclick="openItem('${i.id}')" role="button" tabindex="0">${ribbon}
    <div class="pic">${artOf(i)}${n?`<span class="incart">${n}</span>`:''}</div>
    <div class="info"><h3>${NAME(i)}</h3>${L(i,'sub')?`<div class="sub">${L(i,'sub')}</div>`:''}
      ${i.spicy?`<div class="meta"><span class="tag">${t.spicyTag}</span></div>`:''}
      <div class="row"><div class="price">${pr}</div><button class="add" onclick="event.stopPropagation();quickAdd('${i.id}')" aria-label="${t.add}"><b>+</b>${t.add}</button></div></div></div>`;
}
let shownCats=[];
function renderMenu(){
  const t=T[lang],cats=[...SHOP.categories];
  const pop=SHOP.items.filter(i=>i.popular);
  if(pop.length)cats.splice(SHOP.categories[0]&&SHOP.categories[0].id==='deals'?1:0,0,{id:'popular',_pop:true});
  shownCats=cats.filter(c=>c._pop||SHOP.items.some(i=>i.cat===c.id));
  $('tabs').innerHTML=shownCats.map(c=>`<button class="tab" data-c="${c.id}" onclick="goCat('${c.id}')">${c._pop?t.popular:NAME(c)}</button>`).join('');
  $('menu').innerHTML=shownCats.map(c=>{const list=c._pop?pop:SHOP.items.filter(i=>i.cat===c.id);
    return `<section class="cat" id="cat-${c.id}"><div class="cat-h"><h2>${c._pop?t.popular:NAME(c)}</h2>${c._pop?`<span>${t.popularHint}</span>`:''}</div><div class="grid">${list.map(i=>cardHTML(i,c._pop)).join('')}</div></section>`}).join('');
  spy();
}
function firstCat(){return shownCats[0]?shownCats[0].id:''}
function goCat(id){const el=$('cat-'+id);if(el)el.scrollIntoView({behavior:'smooth'});setTab(id)}
function setTab(id){document.querySelectorAll('.tab').forEach(b=>{const on=b.dataset.c===id;b.classList.toggle('on',on);if(on){const p=b.parentNode;p.scrollTo({left:b.offsetLeft-p.clientWidth/2+b.clientWidth/2,behavior:'smooth'})}})}
let spyObs=null;
function spy(){if(!('IntersectionObserver' in window))return;if(spyObs)spyObs.disconnect();
  spyObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setTab(e.target.id.slice(4))})},{rootMargin:'-140px 0px -60% 0px'});
  document.querySelectorAll('.cat').forEach(s=>spyObs.observe(s));
  const first=document.querySelector('.tab');if(first)first.classList.add('on');}

/* ---------- item sheet ---------- */
function needsSheet(i){return !!(i.sizes||i.spicy||i.sauce)}
function quickAdd(id){const i=byId[id];if(needsSheet(i))return openItem(id);addLine({id,size:null,spicy:null,sauces:[],qty:1})}
function openItem(id){const i=byId[id];if(!needsSheet(i))return quickAdd(id);
  sel={id,size:i.sizes?i.sizes[0].id:null,spicy:i.spicy?true:null,sauces:[],qty:1};drawItem();openSheet('itemSheet')}
function drawItem(){
  const i=byId[sel.id],t=T[lang];
  $('isPic').innerHTML=artOf(i);$('isName').textContent=NAME(i);
  let h='';
  if(L(i,'sub'))h+=`<p style="font-size:14px;color:var(--soft);margin:-4px 2px 12px">${L(i,'sub')}</p>`;
  if(i.sizes)h+=`<div class="grp"><h4>${t.size}<small>${t.required}</small></h4>${i.sizes.map(s=>`<button class="opt ${sel.size===s.id?'on':''}" onclick="sel.size='${s.id}';drawItem()"><span class="mk"></span><span class="t"><b>${NAME(s)}</b>${L(s,'sub')?`<span>${L(s,'sub')}</span>`:''}</span><span class="p">${s.price} ${t.sar}</span></button>`).join('')}</div>`;
  if(i.spicy)h+=`<div class="grp"><h4>${t.spiceT}<small>${t.required}</small></h4><div class="seg"><button class="segb ${sel.spicy?'on':''}" onclick="sel.spicy=true;drawItem()">${t.spicy}</button><button class="segb ${sel.spicy===false?'on':''}" onclick="sel.spicy=false;drawItem()">${t.regular}</button></div></div>`;
  if(i.sauce)h+=`<div class="grp"><h4>${t.sauceT}<small>${t.optional}</small></h4>${SHOP.sauces.map(s=>`<button class="opt chk ${sel.sauces.includes(s.id)?'on':''}" onclick="togSauce('${s.id}')"><span class="mk"></span><span class="t"><b>${NAME(s)}</b></span><span class="p">+${s.price} ${t.sar}</span></button>`).join('')}</div>`;
  $('isBody').innerHTML=h;$('isQ').textContent=sel.qty;$('isTotal').textContent=unitPrice(sel)*sel.qty+' '+t.sar;
}
function togSauce(id){const k=sel.sauces.indexOf(id);if(k>-1)sel.sauces.splice(k,1);else sel.sauces.push(id);drawItem()}
function isQty(d){sel.qty=Math.max(1,Math.min(50,sel.qty+d));drawItem()}
function addFromSheet(){addLine({...sel,sauces:[...sel.sauces]});closeSheets()}
function addLine(l){const k=lineKey(l),ex=cart.find(x=>lineKey(x)===k);if(ex)ex.qty=Math.min(50,ex.qty+l.qty);else cart.push(l);saveCart();refresh();toast(T[lang].added);buzz()}
function buzz(){if(navigator.vibrate)try{navigator.vibrate(10)}catch(e){}}

/* ---------- cart ---------- */
function lineDesc(l){const i=byId[l.id],t=T[lang],p=[];if(i.sizes)p.push(NAME(i.sizes.find(s=>s.id===l.size)));if(l.spicy!==null&&l.spicy!==undefined)p.push(l.spicy?t.spicy.replace('🌶 ',''):t.regular);(l.sauces||[]).forEach(s=>p.push('+ '+NAME(sauceById[s])));return p.join(' · ')}
function openCart(){drawCart();openSheet('cartSheet')}
function drawCart(){
  const t=T[lang];
  if(!cart.length){$('cartBody').innerHTML=`<div class="empty">${ART.cart}<b style="display:block;font-size:17px;color:var(--ink)">${t.empty}</b><p>${t.emptySub}</p></div><button class="more" onclick="closeSheets()">${t.addMore}</button>`;$('cartFoot').classList.add('hide');return}
  $('cartFoot').classList.remove('hide');
  let h=`<div class="grp">${cart.map((l,n)=>`<div class="line"><div class="mini">${artOf(byId[l.id])}</div><div class="t"><b>${NAME(byId[l.id])}</b>${lineDesc(l)?`<span>${lineDesc(l)}</span>`:''}<i>${unitPrice(l)*l.qty} ${t.sar}</i></div><div class="step"><button onclick="lineQty(${n},-1)" aria-label="-">−</button><span>${l.qty}</span><button class="pl" onclick="lineQty(${n},1)" aria-label="+">+</button></div></div>`).join('')}
    <button class="more" onclick="closeSheets()">${t.addMore}</button></div>`;
  h+=`<div class="grp"><h4>${t.noteT}<small>${t.optional}</small></h4><textarea id="note" rows="2" placeholder="${esc(t.notePh)}" oninput="note=this.value">${esc(note)}</textarea></div>`;
  if(SHOP.branches.length>1)h+=`<div class="grp"><h4>${t.branchT}</h4><div class="branches">${SHOP.branches.map(b=>`<button class="segb ${branch===b.id?'on':''}" onclick="setBranch('${b.id}')">${NAME(b)}<br><small style="font-weight:600;color:var(--soft)">${L(b,'area')}</small></button>`).join('')}</div></div>`;
  h+=`<div class="grp"><h4>${t.how}</h4><div class="seg"><button class="segb ${mode==='pickup'?'on':''}" onclick="setMode('pickup')">${t.pickup}</button><button class="segb ${mode==='delivery'?'on':''}" onclick="setMode('delivery')">${t.delivery}</button></div>
    <input id="name" placeholder="${esc(t.name)}" autocomplete="name" value="${esc(store.get('name',''))}" oninput="store.set('name',this.value)">
    ${mode==='delivery'?`<button class="loc ${loc?'ok':''}" id="locBtn" onclick="getLoc()">${loc?t.locOk:t.loc}</button><input id="addr" placeholder="${esc(t.addr)}" value="${esc(store.get('addr',''))}" oninput="store.set('addr',this.value)">`:''}</div>`;
  if(!isOpen())h+=`<div class="notice">${t.closedNote}</div>`;
  h+=`<div class="grp"><div class="sumrow"><span>${t.tot}</span><span>${cartSum()} ${t.sar}</span></div></div><p class="pay">${t.pay}</p>`;
  $('cartBody').innerHTML=h;$('sendTotal').textContent=cartSum()+' '+t.sar;
}
function lineQty(n,d){cart[n].qty+=d;if(cart[n].qty<=0)cart.splice(n,1);saveCart();refresh();drawCart();buzz()}
function setMode(m){mode=m;store.set('mode',m);clearErr();drawCart()}
function setBranch(id){branch=id;store.set('branch',id);clearErr();drawCart();drawVisit()}
function getLoc(){const t=T[lang],b=$('locBtn');if(!navigator.geolocation){showErr(t.locFail);return}b.textContent=t.locWait;
  navigator.geolocation.getCurrentPosition(p=>{loc=`https://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`;clearErr();drawCart()},()=>{b.textContent=t.loc;showErr(t.locFail)},{enableHighAccuracy:true,timeout:10000})}
function showErr(m){$('err').textContent=m}
function clearErr(){$('err').textContent=''}

/* ---------- send ---------- */
function sendOrder(){
  const t=T[lang],name=(($('name')||{}).value||'').trim(),addr=(($('addr')||{}).value||'').trim();
  if(!cart.length)return showErr(t.errItem);
  if(SHOP.branches.length>1&&!branch)return showErr(t.errBranch);
  if(!mode)return showErr(t.errMode);
  if(mode==='delivery'&&!loc&&!addr)return showErr(t.errLoc);
  const b=curBranch();
  let m=t.msg+"\n\n";
  cart.forEach(l=>{const d=lineDesc(l);m+=`• ${l.qty} × ${NAME(byId[l.id])}${d?` (${d})`:''} = ${unitPrice(l)*l.qty} ${t.sar}\n`});
  m+=`\n*${t.tot}: ${cartSum()} ${t.sar}*\n`;
  if(SHOP.branches.length>1)m+=`${t.br}: ${NAME(b)}\n`;
  m+=`${t.type}: ${mode==='pickup'?t.pk:t.dl}\n`;
  if(name)m+=`${t.nm}: ${name}\n`;
  if(mode==='delivery'){if(loc)m+=`${t.lc}: ${loc}\n`;if(addr)m+=`${t.ad}: ${addr}\n`}
  if(note.trim())m+=`${t.nt}: ${note.trim()}\n`;
  m+=t.py;
  store.set('last',{cart:cart.map(l=>({...l})),at:Date.now()});
  const a=document.createElement('a');a.href=`https://wa.me/${b.whatsapp}?text=${encodeURIComponent(m)}`;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  cart=[];note='';saveCart();refresh();closeSheets();
}

/* ---------- reorder ---------- */
function drawReorder(){
  const last=store.get('last',null),t=T[lang],el=$('reorder');
  const lines=last?cleanCart(last.cart):[];
  if(!lines.length){el.classList.add('hide');return}
  const n=lines.reduce((s,l)=>s+l.qty,0),sum=lines.reduce((s,l)=>s+unitPrice(l)*l.qty,0);
  el.innerHTML=`<span class="ic">🔁</span><span><b>${t.reorderT}</b><span>${t.items(n)} · ${sum} ${t.sar}</span></span><span class="go">${t.reorderGo}</span>`;
  el.classList.remove('hide');
}
function reorder(){const last=store.get('last',null);if(!last)return;cart=cleanCart(last.cart).map(l=>({...l}));saveCart();refresh();openCart()}

/* ---------- sheets ---------- */
let openId=null;
function openSheet(id){if(openId)$(openId).classList.remove('on');openId=id;$(id).classList.add('on');$('shade').classList.add('on');document.body.classList.add('lock');if(!history.state||!history.state.sheet)history.pushState({sheet:1},'')}
function closeSheets(fromPop){if(!openId)return;$(openId).classList.remove('on');openId=null;$('shade').classList.remove('on');document.body.classList.remove('lock');clearErr();if(!fromPop&&history.state&&history.state.sheet)history.back()}
window.addEventListener('popstate',()=>closeSheets(true));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheets()});

/* ---------- page ---------- */
function drawVisit(){const b=curBranch();$('mapLink').href=b.map;$('callLink').href='tel:'+b.phone;$('heroCall').href='tel:'+b.phone;$('areaTxt').textContent=L(b,'area');$('phoneTxt').textContent=b.phone}
function refresh(){const t=T[lang];$('cartCount').textContent=cartCount();$('cartTotal').textContent=cartSum()+' '+t.sar;$('cartBtn').classList.toggle('or',cartCount()>0);renderMenu();drawReorder()}
function render(){

  const op=isOpen();$('openTxt').textContent=op?t.openNow:t.closedNow;$('dot').classList.toggle('closed',!op);
  $('hoursTxt').textContent=t.hrs(SHOP.open,SHOP.close);$('langBtn').textContent=t.lang;
  $('social').innerHTML=[['instagram','Instagram'],['snapchat','Snapchat'],['tiktok','TikTok']].filter(s=>SHOP[s[0]]).map(s=>`<a href="${esc(SHOP[s[0]])}" target="_blank" rel="noopener">${s[1]}</a>`).join('');
  $('foot').textContent=SHOP['name_'+lang]+' © '+new Date().getFullYear();
  drawVisit();refresh();
  if(openId==='cartSheet')drawCart();if(openId==='itemSheet')drawItem();
}
function toggleLang(){lang=lang==='ar'?'en':'ar';store.set('lang',lang);render()}
function toast(m){const x=$('toast');x.textContent=m;x.classList.add('show');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('show'),1500)}
function share(){const u=location.href.split('#')[0];if(navigator.share)navigator.share({title:SHOP['name_'+lang],url:u}).catch(()=>{});else{try{navigator.clipboard.writeText(u);toast(T[lang].copied)}catch(e){}}}

/* ---------- install as app ---------- */
let deferred=null;
const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(standalone)$('installSec').classList.add('hide');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});
function installApp(){if(deferred){deferred.prompt();deferred.userChoice.finally(()=>{deferred=null})}else $('iosHelp').classList.remove('hide')}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

render();
</script>
